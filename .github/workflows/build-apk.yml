name: Build PhoneLink diagnostic APK
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell diagnostic scripts
        shell: pwsh
        run: |
          foreach ($file in @(
            "tools/collect_m393_bt_diagnostics.ps1",
            "tools/test_collect_m393_bt_diagnostics.ps1",
            "tools/analyze_m393_bt_report.ps1",
            "tools/test_analyze_m393_bt_report.ps1"
          )) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $file,
              [ref]$tokens,
              [ref]$parseErrors
            )
            if ($parseErrors.Count -gt 0) {
              Write-Host "Syntax errors in $file"
              $parseErrors | Format-List | Out-String | Write-Host
              exit 1
            }
          }
          Write-Host "PowerShell syntax OK"
      - name: Test ADB collector with mocked device
        shell: pwsh
        run: pwsh -NoProfile -File tools/test_collect_m393_bt_diagnostics.ps1
      - name: Test offline report analyzer
        shell: pwsh
        run: pwsh -NoProfile -File tools/test_analyze_m393_bt_report.ps1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
      - name: Package source project
        run: |
          zip -r PhoneLink_M393_Source.zip app build.gradle settings.gradle README_HE.md docs/FEASIBILITY_HE.md docs/ADB_REPORT_ANALYZER_HE.md docs/M393_HFP_HARDWARE_TEST_MATRIX_HE.md tools .github/workflows/build-apk.yml gradlew gradlew.bat gradle/wrapper -x 'app/build/*'
      - uses: actions/upload-artifact@v4
        with:
          name: phonelink-m393-diagnostic-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: phonelink-m393-source
          path: PhoneLink_M393_Source.zip
          if-no-files-found: error
